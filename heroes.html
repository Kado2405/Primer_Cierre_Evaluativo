<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lista de Héroes</title>
<style>
   body {
     font-family: Arial, sans-serif;
     background-color: #f4f4f4;
     margin: 0;
     padding: 20px;
   }
   .heroe {
     background: white;
     border-radius: 8px;
     box-shadow: 0 0 10px rgba(0,0,0,0.1);
     margin-bottom: 20px;
     padding: 20px;
     display: flex;
     align-items: center;
   }
   .heroe img {
     max-width: 150px;
     margin-right: 20px;
     border-radius: 8px;
   }
   .info {
     flex: 1;
   }
   .info h2 {
     margin: 0 0 10px;
   }
   .info p {
     margin: 5px 0;
   }
   .info ul {
     margin: 5px 0;
     padding-left: 20px;
   }
</style>
</head>
<body>
<h1>Heroes Registrados</h1>
<div id="contenedor"></div>
<!-- Enlazar el archivo JS -->
<script src="js/heroes.json"></script>
<script>
   const contenedor = document.getElementById("contenedor");
   data.Hero.forEach(heroe => {
     const div = document.createElement("div");
     div.className = "heroe";
     div.innerHTML = `
<img src="${heroe.foto}" alt="${heroe.nombre}">
<div class="info">
<h2>${heroe.nombre}</h2>
<p><strong>Liga:</strong> ${heroe.liga}</p>
<p><strong>Nivel de Poder:</strong> ${heroe.nivelPoder}</p>
<p><strong>Poderes:</strong></p>
<ul>${heroe.poderes.map(p => `<li>${p}</li>`).join("")}</ul>
</div>
     `;
     contenedor.appendChild(div);
   });
</script>
</body>
</html>
