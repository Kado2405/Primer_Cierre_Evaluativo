<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista de Héroes</title>
  <a href="css/style.css"></a>
</head>
<body class="hola">
<h1>Heroes Registrados</h1>
<div id="contenedor"></div>
<script src="js/heroes.json"></script>
<script>
   const contenedor = document.getElementById("contenedor");
   heroes.Hero.forEach(heroe => {
     const div = document.createElement("div");
     div.className = "heroe";
     div.innerHTML = `
<img src="${heroe.foto}" alt="${heroe.nombre}">
<div class="info">
<h2>${heroe.nombre}</h2>
<p><strong>Liga:</strong> ${heroe.liga}</p>
<p><strong>Nivel de Poder:</strong> ${heroe.nivelPoder}</p>
<p><strong>Poderes:</strong></p>
<ul>${heroe.poderes.map(p => `<li>${p}</li>`).join("")}</ul>
</div>
     `;
     contenedor.appendChild(div);
   });
</script>

</body>

</html>
